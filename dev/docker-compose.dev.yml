version: '3.8'

services:
  # Очередь сообщений для расчетов Celery (sety / ww.py)
  redis:
    image: redis:7-alpine
    container_name: tgid-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
